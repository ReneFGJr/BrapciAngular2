@if (isAdmin()) {
  <section class="admin-area" aria-labelledby="admin-area-title">
    <div class="admin-area__actions">
      <button
        type="button"
        class="admin-action admin-action--danger"
        [attr.aria-label]="'adminArea.actions.delete' | translate"
        [attr.title]="'adminArea.actions.delete' | translate"
        (click)="deleteRegister()"
      >
        <i class="bi bi-trash3" aria-hidden="true"></i>
      </button>

      <button
        type="button"
        class="admin-action"
        [attr.aria-label]="'adminArea.actions.edit' | translate"
        [attr.title]="'adminArea.actions.edit' | translate"
        (click)="editConcept()"
      >
        <i class="bi bi-pencil-square" aria-hidden="true"></i>
      </button>

      <a
        class="admin-action admin-action--bot"
        [href]="'https://cip.brapci.inf.br/tools/nlp/translate/' + recordId()"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="'adminArea.actions.translate' | translate"
        [attr.title]="'adminArea.actions.translate' | translate"
        (click)="selectAction('translate')"
      >
        <i class="bi bi-robot" aria-hidden="true"></i>
      </a>

      <a
        class="admin-action admin-action--bot"
        [href]="'https://cip.brapci.inf.br/tools/nlp/fulltext/' + recordId()"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="'adminArea.actions.process' | translate"
        [attr.title]="'adminArea.actions.process' | translate"
        (click)="selectAction('process')"
      >
        <i class="bi bi-robot" aria-hidden="true"></i>
      </a>
    </div>
  </section>
}
