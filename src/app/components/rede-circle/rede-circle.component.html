<section class="rede-circle" aria-label="Rede circular de autores">
  @if (hasData()) {
    <svg class="rede-circle-svg" [attr.viewBox]="'0 0 ' + viewSize + ' ' + viewSize" role="img" aria-label="Grafo radial de coautoria">
      <g [attr.transform]="'translate(' + (viewSize / 2) + ',' + (viewSize / 2) + ')'">
        <circle class="ring-guide" [attr.r]="outerRadius"></circle>

        <g class="ribbons-layer">
          @for (ribbon of ribbons(); track ribbon.id) {
            <path
              class="ribbon"
              [attr.d]="ribbon.path"
              [attr.fill]="ribbon.color"
              [attr.fill-opacity]="isRibbonDimmed(ribbon.source, ribbon.target) ? ribbon.opacity * 0.1 : ribbon.opacity"
            >
              <title>{{ ribbon.tooltip }}</title>
            </path>
          }
        </g>

        <g class="arcs-layer">
          @for (node of arcNodes(); track node.id) {
            <g>
              <path
                class="arc"
                [attr.d]="node.arcPath"
                [attr.fill]="node.color"
                [attr.opacity]="isLabelDimmed(node.id) ? 0.1 : 1"
              >
                <title>{{ node.label }} | {{ node.tooltip }}</title>
              </path>

              <g class="labels">
                <a
                  [attr.href]="node.url"
                  [attr.aria-label]="'Abrir perfil de ' + node.label"
                  (focus)="setHoveredNode(node.id)"
                  (blur)="setHoveredNode(null)"
                >
                  <text
                    dy=".35em"
                    class="node-label"
                    [class.node-label-dimmed]="isLabelDimmed(node.id)"
                    [attr.opacity]="isLabelDimmed(node.id) ? 0.1 : 1"
                    [attr.transform]="node.labelTransform"
                    [attr.text-anchor]="node.labelAnchor"
                    (pointerenter)="setHoveredNode(node.id)"
                    (pointerleave)="setHoveredNode(null)"
                  >
                    {{ node.label }}
                    <title>{{ node.label }} | {{ node.tooltip }}</title>
                  </text>
                </a>
              </g>
            </g>
          }
        </g>
      </g>
    </svg>
  } @else {
    <p class="rede-empty mb-0">Sem dados de rede.</p>
  }
</section>
